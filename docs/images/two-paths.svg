<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" width="1040" height="600"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
     role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Same prediction, eight orders of magnitude apart</title>
  <desc id="dsc">A logarithmic time axis from one millisecond to one year, with the risk
    pipeline plotted above it and the churn pipeline below. Risk must decide within 80
    milliseconds of a transaction but does not learn whether it was right until a chargeback
    matures 90 days later: a gap of eight orders of magnitude, spanning almost the whole
    chart. Churn decides overnight and learns the answer 30 days later, a gap of about
    thirty times, occupying a short segment near the right. That difference in gap is what
    forces the two systems apart.</desc>

  <defs>
    <marker id="gapR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#eb6834"/>
    </marker>
    <marker id="gapB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a78d6"/>
    </marker>
    <marker id="axEnd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52514e"/>
    </marker>
  </defs>

  <rect width="1040" height="600" rx="10" fill="#fcfcfb"/>

  <!-- ================================ header ============================= -->
  <text x="34" y="42" font-size="18" font-weight="600" fill="#0b0b0b">Same prediction. Eight orders of magnitude apart.</text>
  <text x="34" y="65" font-size="12.5" fill="#52514e">Both models answer &#8220;is something bad about to happen?&#8221;. What separates them is the distance between <tspan font-style="italic">acting</tspan> and <tspan font-style="italic">finding out</tspan>.</text>

  <!-- ============================== RISK lane ============================ -->
  <rect x="34" y="96" width="196" height="34" rx="6" fill="#eb6834"/>
  <text x="48" y="111" font-size="13" font-weight="600" fill="#ffffff">RISK &#183; the shield</text>
  <text x="48" y="124" font-size="10.5" fill="#fbe0d6">t = 0 is a card transaction</text>

  <!-- the window in which the decision has to happen -->
  <rect x="100" y="150" width="156" height="58" rx="4" fill="#fdf3ef"/>
  <text x="106" y="202" font-size="10" fill="#b0715a">the request is open</text>

  <!-- risk track -->
  <line x1="100" y1="208" x2="960" y2="208" stroke="#f0d2c5" stroke-width="2"/>

  <!-- risk: decide -->
  <text x="248" y="160" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="end">DECIDE</text>
  <text x="248" y="175" font-size="11" fill="#52514e" text-anchor="end">80 ms, while the</text>
  <text x="248" y="188" font-size="11" fill="#52514e" text-anchor="end">customer waits</text>
  <line x1="256" y1="192" x2="256" y2="208" stroke="#eb6834" stroke-width="1.4"/>
  <circle cx="256" cy="208" r="7" fill="#eb6834"/>

  <!-- risk: find out -->
  <text x="985" y="160" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="end">FIND OUT</text>
  <text x="985" y="175" font-size="11" fill="#52514e" text-anchor="end">the chargeback</text>
  <text x="985" y="188" font-size="11" fill="#52514e" text-anchor="end">matures, day 90</text>
  <line x1="911" y1="192" x2="911" y2="208" stroke="#eb6834" stroke-width="1.4" stroke-dasharray="3 2"/>
  <circle cx="911" cy="208" r="7" fill="#fcfcfb" stroke="#eb6834" stroke-width="2.5"/>

  <!-- risk: the label-free alarm, below the track so it clears the two labels -->
  <circle cx="790" cy="208" r="5" fill="#1baf7a"/>
  <line x1="790" y1="208" x2="790" y2="224" stroke="#1baf7a" stroke-width="1.4"/>
  <text x="790" y="238" font-size="11" font-weight="600" fill="#1baf7a" text-anchor="middle">alarm fires, day 3</text>
  <text x="790" y="251" font-size="10.5" fill="#52514e" text-anchor="middle">no labels needed</text>

  <!-- risk gap -->
  <line x1="256" y1="278" x2="911" y2="278" stroke="#eb6834" stroke-width="1.6"
        marker-start="url(#gapR)" marker-end="url(#gapR)"/>
  <rect x="392" y="266" width="384" height="24" rx="12" fill="#fcfcfb"/>
  <text x="584" y="283" font-size="12" font-weight="600" fill="#eb6834" text-anchor="middle">10&#8312; &#215; &#8212; you act, then wait a quarter to learn whether you were right</text>

  <text x="100" y="312" font-size="11.5" fill="#52514e">Everything on this side exists to survive that gap: rules that need no labels, a 2% exploration slice so blocking does not</text>
  <text x="100" y="327" font-size="11.5" fill="#52514e">erase the evidence, and an alarm that watches the score distribution instead of the outcome.</text>

  <!-- ================================= axis ============================== -->
  <line x1="100" y1="362" x2="985" y2="362" stroke="#52514e" stroke-width="1.4" marker-end="url(#axEnd)"/>
  <g font-size="10" fill="#52514e" text-anchor="middle">
    <line x1="100" y1="357" x2="100" y2="367" stroke="#52514e"/><text x="100" y="382">1 ms</text>
    <line x1="182" y1="357" x2="182" y2="367" stroke="#52514e"/><text x="182" y="382">10 ms</text>
    <line x1="264" y1="357" x2="264" y2="367" stroke="#52514e"/><text x="264" y="382">100 ms</text>
    <line x1="346" y1="357" x2="346" y2="367" stroke="#52514e"/><text x="346" y="382">1 s</text>
    <line x1="492" y1="357" x2="492" y2="367" stroke="#52514e"/><text x="492" y="382">1 min</text>
    <line x1="638" y1="357" x2="638" y2="367" stroke="#52514e"/><text x="638" y="382">1 hour</text>
    <line x1="751" y1="357" x2="751" y2="367" stroke="#52514e"/><text x="751" y="382">1 day</text>
    <line x1="820" y1="357" x2="820" y2="367" stroke="#52514e"/><text x="820" y="382">1 week</text>
    <line x1="872" y1="357" x2="872" y2="367" stroke="#52514e"/><text x="872" y="382">1 month</text>
    <line x1="961" y1="357" x2="961" y2="367" stroke="#52514e"/><text x="961" y="382">1 year</text>
  </g>
  <text x="542" y="400" font-size="10" fill="#8b8a86" text-anchor="middle">time since t = 0 &#183; log scale</text>

  <!-- ============================== CHURN lane =========================== -->
  <text x="100" y="418" font-size="11.5" fill="#52514e">Nothing here is urgent, so the honest instruments are affordable: score the book overnight, hold 15% back and never</text>
  <text x="100" y="433" font-size="11.5" fill="#52514e">contact them, then read the difference a month later. On this side you can simply wait, and measure.</text>

  <rect x="34" y="470" width="196" height="34" rx="6" fill="#2a78d6"/>
  <text x="48" y="485" font-size="13" font-weight="600" fill="#ffffff">CHURN &#183; the olive branch</text>
  <text x="48" y="498" font-size="10.5" fill="#dce9f9">t = 0 is a customer going quiet</text>

  <!-- churn track -->
  <line x1="100" y1="524" x2="960" y2="524" stroke="#cfe0f6" stroke-width="2"/>

  <text x="743" y="476" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="end">DECIDE</text>
  <text x="743" y="491" font-size="11" fill="#52514e" text-anchor="end">tonight&#8217;s batch,</text>
  <text x="743" y="504" font-size="11" fill="#52514e" text-anchor="end">tomorrow&#8217;s call list</text>
  <line x1="751" y1="508" x2="751" y2="524" stroke="#2a78d6" stroke-width="1.4"/>
  <circle cx="751" cy="524" r="7" fill="#2a78d6"/>

  <text x="890" y="476" font-size="12.5" font-weight="600" fill="#0b0b0b">FIND OUT</text>
  <text x="890" y="491" font-size="11" fill="#52514e">30 days of silence</text>
  <text x="890" y="504" font-size="11" fill="#52514e">confirms the label</text>
  <line x1="872" y1="508" x2="872" y2="524" stroke="#2a78d6" stroke-width="1.4" stroke-dasharray="3 2"/>
  <circle cx="872" cy="524" r="7" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2.5"/>

  <!-- churn gap, below the track -->
  <line x1="751" y1="548" x2="872" y2="548" stroke="#2a78d6" stroke-width="1.6"
        marker-start="url(#gapB)" marker-end="url(#gapB)"/>
  <rect x="779" y="536" width="66" height="24" rx="12" fill="#fcfcfb"/>
  <text x="812" y="553" font-size="12" font-weight="600" fill="#2a78d6" text-anchor="middle">&#8776; 30 &#215;</text>

  <!-- =============================== footer ============================= -->
  <line x1="34" y1="572" x2="1006" y2="572" stroke="#e4e3df" stroke-width="1"/>
  <text x="34" y="592" font-size="12.5" fill="#0b0b0b">Same algorithms, same team, same platform. <tspan font-weight="600">The gap between acting and knowing is what makes them different systems.</tspan></text>
</svg>
