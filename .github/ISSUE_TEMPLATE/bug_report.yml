name: Bug report
description: Something does not run, or does not run the same way twice
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the failing output. `python run_all.py` output is ideal.
      render: shell
    validations: {required: true}
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations: {required: true}
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "output of: .venv/bin/python --version"
    validations: {required: true}
  - type: textarea
    id: freeze
    attributes:
      label: Installed packages
      description: "Output of: .venv/bin/python -m pip freeze"
      render: shell
    validations: {required: true}
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15.5 / Ubuntu 24.04 / Windows 11"
