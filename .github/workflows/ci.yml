name: CI

# Two jobs, deliberately.
#
# `tests` is the fast gate: lint plus the unit tests, on every supported
# interpreter. It guards the invariants that would otherwise be trusted rather
# than checked - point-in-time correctness, holdout stability, policy validation.
#
# `pipelines` runs the whole thing end to end and then asserts the headline
# numbers are the numbers the README quotes. That second half matters: the
# README is full of exact figures, and without this they rot silently the first
# time somebody changes a seed or a threshold.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt ruff
      - run: ruff check .
      - run: pytest

  pipelines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run every pipeline end to end
        run: python run_all.py
      - name: Verify the claims ledger against the run
        run: python scripts/verify_claims.py

      - name: Fail if docs/claims.md is stale
        run: |
          python scripts/verify_claims.py --render
          git diff --exit-code docs/claims.md

      - name: Build the self-contained dashboard
        run: python scripts/build_dashboard.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outputs
          path: outputs/
          retention-days: 7
